name: paysplit
description: "PaySplit - Smart Bill Splitter & Settlement"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  retrofit: 4.7.3
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.2

  # Functional error handling
  fpdart: ^1.1.1

  # Models / immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Local storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2

  # Utils
  logger: ^2.5.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  retrofit_generator: ^9.7.0
  riverpod_generator: ^2.6.3
  injectable_generator: ^2.6.2

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
