name: paysplit
description: "PaySplit - Smart Bill Splitter & Settlement"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  get_it: ^8.0.3
  injectable: ^3.0.0

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.2

  # Functional error handling
  fpdart: ^1.1.1

  # Models / immutability
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Local storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2

  # Utils
  logger: ^2.5.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  hugeicons: ^0.0.8
  flutter_animate: ^4.5.2
  pinput: ^5.0.1
  uuid: ^4.5.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  retrofit_generator: ^10.0.0
  riverpod_generator: ^4.0.0
  injectable_generator: ^3.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
