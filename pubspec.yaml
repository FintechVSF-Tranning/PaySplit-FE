name: paysplit
description: "PaySplit - Smart Bill Splitter & Settlement"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  retrofit: 4.7.3
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.2

  # Functional error handling
  fpdart: ^1.1.1

  # Models / immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Local storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2

  # Utils
  logger: ^2.5.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  hugeicons: ^0.0.8
  flutter_animate: ^4.5.2
  pinput: ^5.0.1
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  zxing2: ^0.2.4
  image: ^4.9.2

  # Firebase Push Notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.6
  camera: ^0.12.0+2
  mobile_scanner: ^7.4.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  retrofit_generator: ^9.7.0
  riverpod_generator: ^2.6.3
  injectable_generator: ^2.6.2

  # Testing
  mocktail: ^1.0.4
  qr: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
